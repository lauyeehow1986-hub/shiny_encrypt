# Native crypto crate (Phase 4+). Built via tools/build_native.R (rextendr toolchain).
# Produces a staticlib that R CMD SHLIB links into shinyencrypt_native.dll, which
# R/backend.R dyn.loads at runtime. If it is not built, the app falls back to the
# pure-R Core AEAD path — nothing here is required for the app to run.
[package]
name = "shinyencrypt_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
extendr-api = "0.7"
# Argon2id (fixes this machine's broken libsodium Argon2). Pure Rust, no C deps.
argon2 = "0.5"
# Phase 4 (PQC), added next: ml-kem, ml-dsa (RustCrypto), x25519-dalek, hkdf, sha2
