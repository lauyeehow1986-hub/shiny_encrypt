# Native crypto crate (Phase 4+). Built via tools/build_native.R (rextendr toolchain).
# Produces a staticlib that R CMD SHLIB links into shinyencrypt_native.dll, which
# R/backend.R dyn.loads at runtime. If it is not built, the app falls back to the
# pure-R Core AEAD path — nothing here is required for the app to run.
[package]
name = "shinyencrypt_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
extendr-api = "0.7"
# Argon2id (fixes this machine's broken libsodium Argon2). Pure Rust, no C deps.
argon2 = "0.5"
# Post-quantum (Phase 4): FIPS 203 ML-KEM + FIPS 204 ML-DSA (pure Rust).
fips203 = "0.4"
fips204 = "0.4"
# Classical half of the hybrid KEM + the KDF that combines the two secrets.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
# Shamir secret sharing (t-of-n) over GF(256). Pure Rust, no C deps.
sharks = "0.5"
# Format-preserving encryption (FF1, NIST SP 800-38G) + its AES block cipher.
fpe = "0.6"
aes = "0.8"
# Time-lock puzzle (RSW sequential squaring): big integers + prime generation.
num-bigint-dig = { version = "0.8", features = ["prime", "rand"] }
rand = "0.8"
# Attribute-Based Encryption (CP-ABE, BSW scheme). Pure Rust: rabe-bn pairing +
# aes-gcm + sha3 + pest, no C deps. serde is on by default (keys/ct serialize).
rabe = "0.4"
serde_json = "1.0"
# Identity-Based Encryption (Kiltz-Vahlis IBE1, IND-CCA2 IBKEM). Pure Rust:
# BLS12-381 pairing + keccak, no C deps. Keys/ct are fixed-size compressed arrays.
ibe = { version = "0.3", features = ["kv1"] }
